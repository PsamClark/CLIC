[build-system]
requires = ["setuptools >= 61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "CLIC"
version = "0.1.1"
dependencies = [
  "numpy",
  "matplotlib",
  "pandas",
  "seaborn",
  "scipy",
  "scikit-learn",
  "scikit-image",
  "torch",
  "torchvision",
  "opencv-python",
  "mrcfile",
  "gemmi",
  "h5py",
  "trimap",
  "umap-learn",
  "joblib",
  "numba",
  "pydantic",
  "click",
]
requires-python = ">=3.10"
authors = [
  {name = "Sam Clark", email = "sam.clark@diamond.ac.uk"},

]
maintainers = [
  {name = "Sam Clark", email = "sam.clark@diamond.ac.uk"},
]
description = "Common Line Implied Clustering"
#readme = "README.rst"
#license = "MIT"
#license-files = ["LICEN[CS]E.*"]
keywords = ["Heterogeneious-particle-sorting", "clustering","dimension-reduction"]
classifiers = [
  "Programming Language :: Python"
]

[project.urls]
Repository = "https://github.com/PsamClark/CLIC.git"
"Bug Tracker" = "https://github.com/PsamClark/CLIC/issues"
Changelog = "https://github.com/PsamClark/CLIC/master/CHANGELOG.md"

[project.scripts]
clic-run = "clic.main:run"
clic-log = "clic.log:collate_scores"

[tool.setuptools]

packages = ["clic"]

[project.optional-dependencies]
test = ["pytest"]


